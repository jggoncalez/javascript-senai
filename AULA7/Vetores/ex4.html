<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 4 - Vetor</title>
</head>
<header style="background-color: #333; color: white; text-align: center; padding: 1px; font-size: 15px;">
    <h2>Exemplo 4 - Vetor</h2>
</header>
<body style="background-color: black; color: white; text-align: center; font-family: monospace;">
    <h1>
        Busca de Elemento no Vetor
    </h1>
    <input type="text" id="vetorBusca" placeholder="Digite os números separados por vírgula">
    <input type="number" id="elementoBusca" placeholder="Elemento a buscar">
    <button onclick="buscarElementoTela()">Buscar Elemento</button>
    <p id="resultadoBusca"></p>

    <script>
        function buscarElementoTela() {
            const vetor = document.getElementById("vetorBusca").value.split(",").map(Number);
            const elemento = Number(document.getElementById("elementoBusca").value);
            const indice = vetor.indexOf(elemento);
            document.getElementById("resultadoBusca").innerHTML = "Índice: " + indice;

        }
    </script>

</body>
